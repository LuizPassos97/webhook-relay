# Local development and demo stack. It uses development settings (a plain-HTTP demo
# receiver, short retries) and must not be used in production; see
# deploy/compose/compose.release.yaml for installations.
#
#   docker compose up -d postgres            # database only, for `npm test` and `npm run start:*`
#   docker compose up -d --build --wait      # full demo stack; see docs/operations.md

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgres://relay:relay_local@postgres:5432/relay
  MASTER_KEY_FILE: /run/relay-keys/master-key
  DEMO_ORIGIN: http://demo-receiver:4000
  # Short retries and timeouts so the demo finishes in seconds.
  RETRY_SCALE: '0.001'
  DELIVERY_TIMEOUT_MS: '1000'
  LEASE_MS: '5000'
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - relay-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 2s
      timeout: 2s
      retries: 20

  # Creates a random master key once and keeps it in a volume, so the demo needs no setup
  # and no key is committed to the repository.
  keygen:
    image: ${API_IMAGE:-webhook-relay-api:local}
    build: { context: ., target: api }
    user: '0'
    command:
      - sh
      - -c
      - >-
        test -s /run/relay-keys/master-key ||
        node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))"
        > /run/relay-keys/master-key
    volumes:
      - relay-keys:/run/relay-keys
    healthcheck: { disable: true }

  migrate:
    image: ${API_IMAGE:-webhook-relay-api:local}
    command: ['node', 'dist/scripts/migrate.js']
    environment: *app-environment
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: { disable: true }

  api:
    image: ${API_IMAGE:-webhook-relay-api:local}
    build: { context: ., target: api }
    init: true
    environment: *app-environment
    volumes:
      - relay-keys:/run/relay-keys:ro
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      keygen: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 15s

  worker:
    image: ${WORKER_IMAGE:-webhook-relay-worker:local}
    build: { context: ., target: worker }
    init: true
    environment: *app-environment
    volumes:
      - relay-keys:/run/relay-keys:ro
    depends_on:
      keygen: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    # Longer than the worker's drain deadline (75% of LEASE_MS).
    stop_grace_period: 10s

  demo-receiver:
    image: ${API_IMAGE:-webhook-relay-api:local}
    init: true
    command: ['node', 'dist/apps/demo-receiver/src/main.js']
    environment:
      HOST: 0.0.0.0
    ports:
      - '127.0.0.1:${DEMO_RECEIVER_PORT:-4000}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/').then(() => process.exit(0), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: `docker compose --profile observability up -d otel-collector`, then start the
  # API and worker with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.149.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'

volumes:
  relay-data:
  relay-keys:
