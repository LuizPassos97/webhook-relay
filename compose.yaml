services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - relay-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  relay-data:
