services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local
      POSTGRES_DB: relay
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - relay-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 2s
      timeout: 2s
      retries: 20
  # Optional: `docker compose --profile observability up -d otel-collector`, then start the
  # API and worker with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.149.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'
volumes:
  relay-data:
